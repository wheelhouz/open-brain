apiVersion: 1

groups:
  - orgId: 1
    name: Open Brain Alerts
    folder: Open Brain
    interval: 1m
    rules:
      - uid: app-down
        title: App Down
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: up{job="open-brain"} == 0
              intervalMs: 15000
              maxDataPoints: 43200
            relativeTimeRange:
              from: 300
              to: 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Open Brain app is unreachable

      - uid: high-error-rate
        title: High HTTP Error Rate
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: rate(open_brain_http_requests_total{status=~"5.."}[5m]) > 0.1
              intervalMs: 15000
              maxDataPoints: 43200
            relativeTimeRange:
              from: 300
              to: 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx error rate above 0.1/s for 2+ minutes"

      - uid: budget-cutoff
        title: AI Budget Cutoff Triggered
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: increase(open_brain_budget_cutoff_total[1h]) > 0
              intervalMs: 15000
              maxDataPoints: 43200
            relativeTimeRange:
              from: 3600
              to: 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Hard spend cutoff fired — AI calls are blocked"
