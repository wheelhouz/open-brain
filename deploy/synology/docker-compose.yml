services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: open_brain
      POSTGRES_USER: brain_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /volume1/docker/open-brain/data:/var/lib/postgresql/data
    networks:
      - brain-net
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain_app -d open_brain"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    container_name: open-brain-app
    image: ${DOCKER_IMAGE:-ghcr.io/wheelhouz/open-brain:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8420:8420"
    environment:
      DATABASE_URL: postgresql://brain_app:${DB_PASSWORD}@db:5432/open_brain
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BRAIN_ACCESS_KEY: ${BRAIN_ACCESS_KEY}
      CHAT_MODEL: ${CHAT_MODEL:-anthropic/claude-sonnet-4-6}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-openai/gpt-4o-mini}
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    networks:
      - brain-net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - /volume1/docker/open-brain/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - brain-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - /volume1/docker/open-brain/grafana/provisioning:/etc/grafana/provisioning:ro
      - /volume1/docker/open-brain/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - brain-net
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - /volume1/docker/open-brain/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - brain-net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - /volume1/docker/open-brain/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - brain-net
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    volumes:
      - uptime_data:/app/data
    ports:
      - "3002:3001"
    networks:
      - brain-net
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  uptime_data:

networks:
  brain-net:
    name: brain-net
    driver: bridge
