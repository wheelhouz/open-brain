services:
  # --- Config init: copies monitoring configs from image to shared volume ---
  config-init:
    image: ${CONFIG_IMAGE:-ghcr.io/wheelhouz/open-brain-config:latest}
    volumes:
      - monitoring_config:/out
    restart: "no"

  # --- Core services ---
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: open_brain
      POSTGRES_USER: brain_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /volume1/docker/open-brain/data:/var/lib/postgresql/data
    networks:
      - brain-net
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain_app -d open_brain"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    container_name: open-brain-app
    image: ${DOCKER_IMAGE:-ghcr.io/wheelhouz/open-brain:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8420:8420"
    environment:
      DATABASE_URL: postgresql://brain_app:${DB_PASSWORD}@db:5432/open_brain
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BRAIN_ACCESS_KEY: ${BRAIN_ACCESS_KEY}
      CHAT_MODEL: ${CHAT_MODEL:-anthropic/claude-sonnet-4-6}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-openai/gpt-4o-mini}
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    networks:
      - brain-net

  # --- Monitoring services ---
  prometheus:
    image: prom/prometheus:latest
    command: --config.file=/config/prometheus.yml --storage.tsdb.path=/prometheus
    volumes:
      - monitoring_config:/config:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      config-init:
        condition: service_completed_successfully
    networks:
      - brain-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /config/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - monitoring_config:/config:ro
    ports:
      - "3001:3000"
    depends_on:
      config-init:
        condition: service_completed_successfully
    networks:
      - brain-net
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    command: -config.file=/config/loki.yml
    volumes:
      - monitoring_config:/config:ro
      - loki_data:/loki
    depends_on:
      config-init:
        condition: service_completed_successfully
    networks:
      - brain-net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    command: -config.file=/config/promtail.yml
    volumes:
      - monitoring_config:/config:ro
      - /volume1/@docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
    networks:
      - brain-net
    restart: unless-stopped

volumes:
  monitoring_config:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  brain-net:
    name: brain-net
    driver: bridge
